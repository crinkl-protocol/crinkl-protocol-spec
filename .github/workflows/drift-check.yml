name: protocol-integrity

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      documentation_surface: ${{ steps.filter.outputs.documentation_surface }}
      protected_version_surface: ${{ steps.filter.outputs.protected_version_surface }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            documentation_surface:
              - '**/*.md'
              - 'scripts/check_drift.py'
              - 'scripts/check_living_version_claims.py'
            protected_version_surface:
              - '.github/workflows/drift-check.yml'
              - '01-core/**'
              - 'bindings/**'
              - 'schemas/**'
              - '07-conformance/**'
              - 'versions/**'
              - 'scripts/check_drift.py'
              - 'scripts/check_living_version_claims.py'
              - 'scripts/check_released_identifier_erratum.py'
              - 'scripts/verify_conformance.mjs'

  protocol-integrity:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python3 -m pip install --upgrade pip pyyaml jsonschema cryptography
      - name: Boundary classification
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          python3 scripts/check_change_boundary.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Documentation version claims
        if: needs.changes.outputs.documentation_surface == 'true' || needs.changes.outputs.protected_version_surface == 'true'
        run: python3 scripts/check_living_version_claims.py
      - name: Protected released-identifier erratum integrity
        if: needs.changes.outputs.protected_version_surface == 'true'
        run: python3 scripts/check_released_identifier_erratum.py --local-only
      - name: Protected public conformance and profile vectors
        if: needs.changes.outputs.protected_version_surface == 'true'
        run: |
          node scripts/verify_conformance.mjs --strict-coverage
          python3 07-conformance/profiles/campaign-direct-buyer-reward-v1/scripts/check_campaign_direct_reward_profile_vectors.py
          python3 07-conformance/profiles/campaign-direct-buyer-reward-v1/scripts/generate_campaign_direct_reward_profile_vectors.py --check
          node scripts/verify_conformance.mjs --require-kind campaign.directBuyerReward.profileV1
