name: protocol-integrity

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      documentation_surface: ${{ steps.filter.outputs.documentation_surface }}
      protected_version_surface: ${{ steps.filter.outputs.protected_version_surface }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            documentation_surface:
              - '**/*.md'
              - 'scripts/check_drift.py'
              - 'scripts/check_living_version_claims.py'
            protected_version_surface:
              - '.github/workflows/drift-check.yml'
              - '01-core/**'
              - 'bindings/**'
              - 'schemas/**'
              - '07-conformance/**'
              - 'versions/**'
              - 'scripts/check_drift.py'
              - 'scripts/check_living_version_claims.py'
              - 'scripts/check_released_identifier_erratum.py'
              - 'scripts/check_version_identifier_inventory.py'
              - 'scripts/test_check_released_identifier_erratum.py'
              - 'scripts/test_check_version_identifier_inventory.py'
              - 'scripts/verify_conformance.mjs'

  protocol-integrity:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python3 -m pip install --upgrade pip pyyaml jsonschema cryptography
      - name: Boundary classification
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: >-
          python3 scripts/check_change_boundary.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
      - name: Documentation version claims
        if: needs.changes.outputs.documentation_surface == 'true' || needs.changes.outputs.protected_version_surface == 'true'
        run: python3 scripts/check_living_version_claims.py
      - name: Checkout adopted protocol evidence
        if: needs.changes.outputs.protected_version_surface == 'true'
        uses: actions/checkout@v4
        with:
          repository: crinkl-protocol/crinkl-protocol
          ref: 52648bae72a8c3b83883392be1c4ae714e4359c3
          path: adopted-protocol
          fetch-depth: 0
      - name: Protected version inventory and erratum
        if: needs.changes.outputs.protected_version_surface == 'true'
        run: |
          python3 scripts/check_version_identifier_inventory.py --adopted-repo adopted-protocol
          python3 scripts/test_check_version_identifier_inventory.py --adopted-repo adopted-protocol
          python3 scripts/check_released_identifier_erratum.py --adopted-repo adopted-protocol
          python3 scripts/test_check_released_identifier_erratum.py --adopted-repo adopted-protocol
      - name: Protected conformance and release profile
        if: needs.changes.outputs.protected_version_surface == 'true'
        run: |
          node scripts/verify_conformance.mjs --strict-coverage
          python3 scripts/check_campaign_direct_reward_release_profile.py
          python3 07-conformance/profiles/campaign-direct-buyer-reward-v1/scripts/check_campaign_direct_reward_profile_vectors.py
          python3 07-conformance/profiles/campaign-direct-buyer-reward-v1/scripts/generate_campaign_direct_reward_profile_vectors.py --check
          node scripts/verify_conformance.mjs --require-kind campaign.directBuyerReward.profileV1

          release_status="$(python3 -c 'import json; print(json.load(open("versions/release.json", encoding="utf-8"))["status"])')"
          case "$release_status" in
            RELEASE_CANDIDATE_NOT_PUBLISHED)
              python3 scripts/check_rc3_release_finalization.py --mode candidate
              set +e
              node scripts/verify_conformance.mjs --require-released --require-kind campaign.directBuyerReward.profileV1
              status=$?
              set -e
              test "$status" -eq 4
              ;;
            RELEASED)
              python3 scripts/check_rc3_release_finalization.py --mode released
              node scripts/verify_conformance.mjs --require-released --require-kind campaign.directBuyerReward.profileV1
              ;;
            *)
              echo "unsupported release status: $release_status" >&2
              exit 1
              ;;
          esac
