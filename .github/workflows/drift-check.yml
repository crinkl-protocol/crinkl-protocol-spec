name: protocol-drift-check

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: python3 -m pip install --upgrade pip pyyaml
      - name: Drift check
        run: python3 scripts/check_drift.py
